version: "3.9"

services:

  ttp:

    build:
      context: .
      dockerfile: dockerfile.ttp

    container_name: ttp

    ports:
      - "9000:9000"

    networks:
      - scs


  server:

    build:
      context: .
      dockerfile: dockerfile.server

    container_name: server

    depends_on:
      - ttp

    ports:
      - "8000:8000"

    networks:
      - scs


networks:

  scs: